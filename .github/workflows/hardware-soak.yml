name: Kinect hardware soak

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: Connect/start/capture/stop cycles per pipeline
        required: true
        default: "100"
      frames:
        description: Frames captured in each cycle
        required: true
        default: "300"
      reconnect_cycles:
        description: Operator-assisted unplug/replug recoveries (0 skips)
        required: true
        default: "1"

permissions:
  contents: read

jobs:
  soak:
    name: Sanitized CPU and Metal soak
    runs-on: [self-hosted, macOS, kinect]
    timeout-minutes: 120
    env:
      ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:strict_string_checks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      MTL_DEBUG_LAYER: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      - name: Configure sanitized hardware build
        run: >-
          cmake -S . -B build-soak -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_EXAMPLES=ON
          -DBUILD_OPENNI2_DRIVER=OFF
          -DCMAKE_CXX_STANDARD=11
          -DENABLE_ASAN=ON
          -DENABLE_UBSAN=ON
          -DENABLE_METAL=ON
          -DENABLE_OPENCL=OFF
          -DENABLE_CUDA=OFF
          -DENABLE_OPENGL=OFF
          -DENABLE_WARNINGS_AS_ERRORS=ON

      - name: Build lifecycle tools
        run: cmake --build build-soak -j --target Protonect KinectReconnect

      - name: Exercise reconnect and stream lifecycles
        run: >-
          bash tools/quality/hardware_soak.sh
          build-soak/bin/Protonect
          '${{ inputs.iterations }}'
          '${{ inputs.frames }}'
          cpu metal

      - name: Exercise unplug/replug recovery with fresh device objects
        if: ${{ inputs.reconnect_cycles != '0' }}
        run: >-
          bash tools/quality/reconnect_soak.sh
          build-soak/bin/KinectReconnect
          '${{ inputs.reconnect_cycles }}'
