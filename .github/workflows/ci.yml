name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CTEST_OUTPUT_ON_FAILURE: "1"

jobs:
  build-test-metal:
    name: AppleClang, Metal, C++11
    # Fork PRs must never execute on the persistent self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false

      - name: Configure
        run: >-
          cmake -S . -B build-metal -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DBUILD_EXAMPLES=ON
          -DCMAKE_CXX_STANDARD=11
          -DENABLE_METAL=ON
          -DENABLE_WARNINGS_AS_ERRORS=ON
          -DENABLE_STDLIB_HARDENING=ON

      - name: Build
        run: cmake --build build-metal -j

      - name: Test, including Metal parity
        run: ctest --test-dir build-metal --timeout 120

  linux-builds:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC, shared, C++11
            cc: gcc
            cxx: g++
            shared: ON
          - name: GCC, static, C++11
            cc: gcc
            cxx: g++
            shared: OFF
          - name: Clang, shared, C++11
            cc: clang
            cxx: clang++
            shared: ON
          - name: Clang, static, C++11
            cc: clang
            cxx: clang++
            shared: OFF
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build pkg-config libusb-1.0-0-dev libturbojpeg0-dev

      - name: Configure
        env:
          BUILD_SHARED_LIBS: ${{ matrix.shared }}
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_SHARED_LIBS="$BUILD_SHARED_LIBS"
          -DBUILD_TESTING=ON
          -DBUILD_EXAMPLES=ON
          -DBUILD_OPENNI2_DRIVER=OFF
          -DCMAKE_CXX_STANDARD=11
          -DENABLE_OPENCL=OFF
          -DENABLE_CUDA=OFF
          -DENABLE_OPENGL=OFF
          -DENABLE_VAAPI=OFF
          -DENABLE_TEGRAJPEG=OFF
          -DENABLE_WARNINGS_AS_ERRORS=ON
          -DENABLE_STDLIB_HARDENING=ON

      - name: Build
        run: cmake --build build -j 2

      - name: Test
        run: ctest --test-dir build -LE gpu --timeout 120

      - name: Test installed package with out-of-tree examples
        run: |
          cmake --install build --prefix "$PWD/build/install"
          cmake -S examples -B build-installed-examples -G Ninja \
            -DENABLE_OPENGL=OFF \
            -Dfreenect2_DIR="$PWD/build/install/lib/cmake/freenect2"
          cmake --build build-installed-examples -j 2

  linux-filter-backends:
    name: Clang, PoCL and llvmpipe filter parity
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
      LIBGL_ALWAYS_SOFTWARE: "1"
      POCL_DEVICES: pthread
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install software OpenCL and OpenGL runtimes
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang ninja-build pkg-config libusb-1.0-0-dev libturbojpeg0-dev \
            ocl-icd-opencl-dev pocl-opencl-icd \
            libglfw3-dev libgl1-mesa-dev mesa-utils xvfb

      - name: Configure filter backends
        run: >-
          cmake -S . -B build-filter-backends -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_STANDARD=11
          -DBUILD_TESTING=ON
          -DBUILD_EXAMPLES=OFF
          -DBUILD_OPENNI2_DRIVER=OFF
          -DENABLE_OPENCL=ON
          -DENABLE_OPENGL=ON
          -DENABLE_CUDA=OFF
          -DENABLE_VAAPI=OFF
          -DENABLE_TEGRAJPEG=OFF
          -DENABLE_WARNINGS_AS_ERRORS=ON

      - name: Build filter parity tests
        run: cmake --build build-filter-backends -j 2 --target unit_tests

      - name: Test all OpenCL and OpenGL filter combinations
        run: >-
          xvfb-run -a -s '-screen 0 1024x768x24'
          ctest --test-dir build-filter-backends
          -R '^(OpenCLCpuParity|OpenGLCpuParity)\.'
          --timeout 120 --output-on-failure

  linux-vaapi:
    name: Clang, VAAPI selection and fake failover
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install VAAPI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang ninja-build pkg-config libusb-1.0-0-dev libturbojpeg0-dev \
            libjpeg-dev libva-dev

      - name: Configure VAAPI
        run: >-
          cmake -S . -B build-vaapi -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_STANDARD=11
          -DBUILD_TESTING=ON
          -DBUILD_EXAMPLES=OFF
          -DBUILD_OPENNI2_DRIVER=OFF
          -DENABLE_OPENCL=OFF
          -DENABLE_OPENGL=OFF
          -DENABLE_CUDA=OFF
          -DENABLE_VAAPI=ON
          -DENABLE_TEGRAJPEG=OFF
          -DENABLE_WARNINGS_AS_ERRORS=ON

      - name: Compile VAAPI and failover paths
        run: cmake --build build-vaapi -j 2 --target freenect2 unit_tests

      - name: Test initialization and runtime failover
        run: >-
          ctest --test-dir build-vaapi
          -R '^(RgbDecoderFallback\.|PublicApi\.VaapiInitializationFailure)'
          --timeout 120 --output-on-failure

  cuda-12-3:
    name: CUDA 12.3 compile-only
    runs-on: ubuntu-24.04
    container: nvidia/cuda:12.3.2-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install CUDA build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --yes \
            cmake ninja-build git pkg-config libusb-1.0-0-dev libturbojpeg0-dev

      - name: Configure both CUDA depth pipelines
        run: >-
          cmake -S . -B build-cuda -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_STANDARD=11
          -DCMAKE_CUDA_ARCHITECTURES=75
          -DBUILD_TESTING=OFF
          -DBUILD_EXAMPLES=OFF
          -DBUILD_OPENNI2_DRIVER=OFF
          -DENABLE_CUDA=ON
          -DENABLE_OPENCL=OFF
          -DENABLE_OPENGL=OFF
          -DENABLE_VAAPI=OFF
          -DENABLE_TEGRAJPEG=OFF
          -DENABLE_WARNINGS_AS_ERRORS=ON

      - name: Compile standard and KDE CUDA pipelines
        run: cmake --build build-cuda -j 2 --target freenect2

  windows-msvc:
    name: MSVC, ${{ matrix.linkage }}, C++11
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - linkage: static
            shared: OFF
          - linkage: shared
            shared: ON
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install dependencies
        shell: pwsh
        run: >-
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install
          libusb:x64-windows libjpeg-turbo:x64-windows

      - name: Configure
        shell: pwsh
        env:
          BUILD_SHARED_LIBS: ${{ matrix.shared }}
        run: >-
          cmake -S . -B build-msvc -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows
          -DBUILD_SHARED_LIBS="$env:BUILD_SHARED_LIBS"
          -DBUILD_TESTING=ON
          -DBUILD_EXAMPLES=ON
          -DBUILD_OPENNI2_DRIVER=OFF
          -DCMAKE_CXX_STANDARD=11
          -DENABLE_OPENCL=OFF
          -DENABLE_CUDA=OFF
          -DENABLE_OPENGL=OFF
          -DENABLE_VAAPI=OFF
          -DENABLE_TEGRAJPEG=OFF
          -DENABLE_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build-msvc --config Debug -j 2

      - name: Test
        shell: pwsh
        run: |
          $env:PATH = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/debug/bin;$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin;$env:PATH"
          ctest --test-dir build-msvc -C Debug -LE gpu --timeout 120

  sanitizers:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ASan + UBSan + LeakSanitizer
            flags: -DENABLE_ASAN=ON -DENABLE_UBSAN=ON
          - name: TSan, C++11
            flags: -DENABLE_TSAN=ON
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build clang pkg-config libusb-1.0-0-dev libturbojpeg0-dev

      - name: Configure
        run: >-
          cmake -S . -B build-sanitized -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DBUILD_EXAMPLES=OFF
          -DBUILD_OPENNI2_DRIVER=OFF
          -DCMAKE_CXX_STANDARD=11
          -DENABLE_OPENCL=OFF
          -DENABLE_CUDA=OFF
          -DENABLE_OPENGL=OFF
          -DENABLE_VAAPI=OFF
          -DENABLE_TEGRAJPEG=OFF
          ${{ matrix.flags }}

      - name: Build
        run: cmake --build build-sanitized -j 2

      - name: Test under sanitizer
        run: ctest --test-dir build-sanitized -L unit --timeout 180

  fuzzers:
    name: Parser fuzz smoke tests
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build clang pkg-config libusb-1.0-0-dev libturbojpeg0-dev

      - name: Configure
        run: >-
          cmake -S . -B build-fuzz -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DENABLE_FUZZING=ON
          -DBUILD_EXAMPLES=OFF
          -DBUILD_OPENNI2_DRIVER=OFF
          -DCMAKE_CXX_STANDARD=11
          -DENABLE_OPENCL=OFF
          -DENABLE_CUDA=OFF
          -DENABLE_OPENGL=OFF
          -DENABLE_VAAPI=OFF
          -DENABLE_TEGRAJPEG=OFF

      - name: Build fuzzers
        run: >-
          cmake --build build-fuzz -j 2 --target
          fuzz_rgb_stream_parser fuzz_depth_stream_parser fuzz_protocol_response
          fuzz_recording_metadata

      - name: Run bounded fuzz smoke tests
        run: ctest --test-dir build-fuzz -L fuzz --timeout 180

  coverage:
    name: Coverage floor
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build clang llvm pkg-config python3 \
            libusb-1.0-0-dev libturbojpeg0-dev

      - name: Configure
        run: >-
          cmake -S . -B build-coverage -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DBUILD_EXAMPLES=OFF
          -DBUILD_OPENNI2_DRIVER=OFF
          -DCMAKE_CXX_STANDARD=11
          -DENABLE_COVERAGE=ON
          -DENABLE_OPENCL=OFF
          -DENABLE_CUDA=OFF
          -DENABLE_OPENGL=OFF
          -DENABLE_VAAPI=OFF
          -DENABLE_TEGRAJPEG=OFF

      - name: Build and test
        run: |
          cmake --build build-coverage -j 2
          LLVM_PROFILE_FILE="$PWD/build-coverage/unit-%p.profraw" \
            ctest --test-dir build-coverage -L unit --timeout 120

      - name: Generate and enforce coverage report
        run: |
          llvm-profdata merge -sparse build-coverage/*.profraw -o build-coverage/unit.profdata
          llvm-cov report build-coverage/bin/unit_tests \
            -instr-profile=build-coverage/unit.profdata \
            -ignore-filename-regex='(_deps/|tests/|include/internal/CL/|tools/generate_resources)' \
            "$PWD/src" "$PWD/include/libfreenect2" "$PWD/include/internal/libfreenect2" \
            | tee build-coverage/coverage.txt
          python3 tools/quality/check_coverage.py build-coverage/coverage.txt \
            --min-lines 30 --min-branches 25
          llvm-cov export build-coverage/bin/unit_tests \
            -instr-profile=build-coverage/unit.profdata \
            -ignore-filename-regex='(_deps/|tests/|include/internal/CL/|tools/generate_resources)' \
            -format=lcov > build-coverage/coverage.lcov

      - uses: actions/upload-artifact@v4
        with:
          name: llvm-coverage
          path: |
            build-coverage/coverage.txt
            build-coverage/coverage.lcov

  format:
    name: clang-format (advisory)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install --yes clang-format

      - name: Check changed C++ files
        shell: bash
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$GH_EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          else
            base="$PUSH_BEFORE_SHA"
          fi
          if ! git cat-file -e "$base" 2>/dev/null; then
            base="HEAD~1"
          fi
          # git clang-format --diff may exit 1 when formatting differs. Capture
          # that status without allowing unrelated execution failures to pass.
          set +e
          format_diff=$(git clang-format --diff "$base" HEAD)
          format_status=$?
          set -e
          if [[ "$format_diff" == *"diff --git"* ]]; then
            echo "$format_diff"
            echo "Changed C++ lines are not clang-formatted." >&2
            exit 1
          fi
          if (( format_status != 0 )); then
            echo "git clang-format failed with status $format_status." >&2
            exit "$format_status"
          fi

  semgrep:
    name: Semgrep policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install semgrep
        run: pipx install semgrep

      - name: Run focused policy
        run: semgrep scan --config tools/quality/semgrep.yml --error --metrics=off

  static-analysis:
    name: clang-tidy 18
    runs-on: ubuntu-24.04
    env:
      CC: clang-18
      CXX: clang++-18
      CLANG_TIDY: clang-tidy-18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build clang-18 clang-tidy-18 pkg-config python3 \
            libusb-1.0-0-dev libturbojpeg0-dev

      - name: Configure compile database
        run: >-
          cmake -S . -B build-tidy -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DBUILD_TESTING=ON
          -DBUILD_EXAMPLES=ON
          -DBUILD_OPENNI2_DRIVER=OFF
          -DCMAKE_CXX_STANDARD=11
          -DENABLE_OPENCL=OFF
          -DENABLE_CUDA=OFF
          -DENABLE_OPENGL=OFF
          -DENABLE_VAAPI=OFF
          -DENABLE_TEGRAJPEG=OFF

      - name: Build generated inputs
        run: cmake --build build-tidy -j 2

      - name: Analyze every first-party translation unit
        run: python3 tools/quality/run_clang_tidy.py build-tidy --jobs 2
