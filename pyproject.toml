[project]
name = "libfreenect2-tooling"
version = "0.3.0"
description = "Python development tools for libfreenect2-metal"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
test = ["pytest>=8.4,<9"]
lint = ["ruff>=0.12,<0.16"]
dev = [
  {include-group = "test"},
  {include-group = "lint"},
]

[tool.uv]
required-version = ">=0.12,<0.13"
default-groups = ["dev"]
package = false

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PT"]
ignore = ["E501", "RUF001"]
